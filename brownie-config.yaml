# Brownie configuration file
# https://eth-brownie.readthedocs.io/en/stable/config.html
# required external contracts

project-structure:
  contracts: contract
  tests: test
  reports: coverage/reports

compiler:
    solc:
        optimizer:
          enabled: true
          runs: 200
        remappings:
          - "@openzeppelin/contracts=node_modules/@openzeppelin/contracts"
          - "@openzeppelin/contracts-upgradeable=node_modules/@openzeppelin/contracts-upgradeable"
          - "@chainlink/contracts=node_modules/@chainlink/contracts"
          - "@uniswap/v3-core/contracts=node_modules/@uniswap/v3-core/contracts"
          - "@uniswap/v3-periphery/contracts=node_modules/@uniswap/v3-periphery/contracts"

networks:
  development:
    # forked anvil blocks carry a real base fee, brownie's default gas_price 0 is rejected
    gas_price: auto
    # Arbitrum block gas limit is ~1.1e15, brownie's default gas_limit max makes gas*price exceed any balance
    gas_limit: auto
